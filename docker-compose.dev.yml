services:
  dogovor-dev:
    build: .
    container_name: dogovor-dev
    restart: always
    ports:
      - "5050:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dogovor-dev-secret-key}
      - ENVIRONMENT=development
      - TZ=Europe/Moscow
    volumes:
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
